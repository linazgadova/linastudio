      property="og:image:alt"
      content="Первый экран сайта Ангелины Згадовой: заголовок «Придумываю продукты и собираю сама»"
    />

    <!--
      ПОДТВЕРЖДЕНИЕ ПРАВ НА САЙТ

      Этими строками Вебмастер и Search Console подтверждают права
      владельца. Без них они не покажут ни того, по каким запросам
      сюда приходят, ни того, что у сайта с индексацией.

      Коды публичные — они и должны лежать открыто в коде страницы.
      Удалять их после проверки нельзя: оба сервиса перепроверяют
      права время от времени и молча отключают доступ, не найдя тега.

      Проверка через счётчик Метрики здесь не работает намеренно.
      Яндекс считает счётчик установленным, когда тот присылает данные,
      а он подключается только после согласия в окне про куки — робот
      его не нажимает. Ставить счётчик до согласия ради проверки прав
      значит обнулить смысл самого окна.

      Яндекс тут важнее: у него доля рынка в России больше, и он же
      хуже всех справляется с сайтами, которые рисуются в браузере.
      Именно ради него после сборки в страницы пишется настоящий текст
      (см. scripts/seo.mjs).
    -->
    <!--
      Коды привязаны к паре «аккаунт + адрес сайта». Прежние выдавались
      под старую площадку и на linastudio.ru не подходили: проверка
      отвечала «не подтверждено», хотя строки в разметке стояли.
      Эти получены уже для нового домена.
    -->
    <meta name="yandex-verification" content="c52166fa3282b446" />
    <meta name="google-site-verification" content="Vh87s6Joy0qqvIa_Ka2EBdnMN7zLfyapCgvZaZ5ogsQ" />

    <!-- Робот сам решает, показывать ли расширенный сниппет, но
         явное разрешение снимает ограничение на длину описания
         и на размер картинки в выдаче -->
    <meta
      name="robots"
      content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
    />

    <!--
      Иконки. Вектор — основной: он один остаётся резким и на вкладке,
      и в закладках, и на экране с любой плотностью точек.

      Растр нужен там, где вектор не берут: айфон при добавлении сайта
      на домашний экран рисует иначе скриншот страницы, а андроид
      просит квадраты для окна установки. Все они собираются из того же
      favicon.svg командой node scripts/icons.mjs — держать их врозь
      значит однажды поменять иконку и забыть половину.
    -->
    <!--
      Порядок здесь важен. Браузеры берут SVG и рисуют его чётко на
      любой плотности точек. А поисковики — Яндекс в первую очередь —
      ходят за значком по старому адресу /favicon.ico и объявленный
      вектор нередко пропускают: в выдаче на его месте оказывается
      серый глобус.

      Поэтому лежат оба. ICO собран из того же icon-192.png и внутри
      несёт обычный PNG: формат это разрешает с Vista, а 192 точки
      перекрывают все места, где значок показывают крупно.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      Разметка для поиска и для ответов языковых моделей.

      Это заготовка на время разработки. В собранном сайте её
      заменяет постобработка (scripts/seo.mjs): у главной, у страниц
      проектов и у каждой языковой версии разметка своя.

      Так сделано не ради красоты. Раньше этот блок целиком уезжал
      на все страницы разом, и на разборе проекта оказывался список
      вопросов и ответов, которых на той странице нет. Разметка,
      описывающая то, чего на странице не видно, — нарушение правил
      и Яндекса, и Google, и снимают за неё, а не добавляют.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "%SITE%/#person",
            "name": "Ангелина Згадова",
            "alternateName": "Angelina Zgadova",
            "jobTitle": "Веб-дизайнер и разработчик",
            "email": "mailto:zgadova123@gmail.com",
            "url": "%SITE%/",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Москва",
              "addressCountry": "RU"
            },
            "sameAs": ["https://t.me/iteachzg"]
          },
          {
            "@type": "WebSite",
            "@id": "%SITE%/#website",
            "url": "%SITE%/",
            "name": "Ангелина Згадова",
            "inLanguage": ["ru", "en"],
            "publisher": { "@id": "%SITE%/#person" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <!--
      THESIS: портфолио, которое доказывает умение собой: один стеклянный
      шар с объёмным сиянием внутри катится сквозь страницу и держит
      композицию, а сайт отвечает на вопросы о себе на собственных данных.
      OWN-WORLD: холодная бумага (#f4f4f8), малиновый (#ff2d6f),
      электрический фиолет (#4b2bf5) и мята (#00d4c8) — цвета приходят
      из сияния, а не из палитры; пунктирные фигуры вместо рамок.
      STORY: заголовок со сбивкой вокруг центра, шар за ним, строка вопроса
      снизу; дальше шар уходит вправо к проектам, влево к рассказу о себе
      и вниз под контакты, оставляя за собой пунктирную траекторию.
      FORM: ткацкий заправочный рисунок, позиция 4, seed da1454f7.
      FINISH: unreviewed and undocumented is unfinished.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
