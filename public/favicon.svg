<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Шар с сайта, сведённый к тому, что различимо в шестнадцать пикселей.

    На вкладке иконка живёт размером с букву, и переливы, складки
    и вмятина там не читаются вовсе — остаются три вещи: круг,
    диагональ цвета и тень с одной стороны. Их и рисуем.

    Фон бумажный, а не тёмный: сайт светлый, и тёмный квадрат
    в ряду вкладок выдавал бы себя за что-то чужое.
  -->
  <defs>
    <!--
      Заливка идёт из верхнего левого угла в нижний правый: там же,
      откуда падает свет в самой сцене. Порядок красок тот же, что
      в кольце палитры — малиновый, сирень, синий, — поэтому иконка
      и шар читаются одним предметом.
    -->
    <linearGradient id="film" x1="0.18" y1="0.12" x2="0.86" y2="0.94">
      <stop offset="0" stop-color="#FF4FA0" />
      <stop offset="0.34" stop-color="#FF2D6F" />
      <stop offset="0.66" stop-color="#B978FF" />
      <stop offset="1" stop-color="#4B2BF5" />
    </linearGradient>

    <!--
      Тень серпом с теневой стороны — единственное, что превращает
      круг в шар. Ровное кольцо по краю дало бы обратное: обведённый
      круг читается плоским.
    -->
    <radialGradient id="limb" cx="0.34" cy="0.26" r="0.92">
      <stop offset="0.52" stop-color="#1B0E45" stop-opacity="0" />
      <stop offset="1" stop-color="#1B0E45" stop-opacity="0.55" />
    </radialGradient>

    <!-- Блик размером с четверть шара, размытый до потери формы:
         резкое пятно на таком размере выглядит дефектом печати -->
    <radialGradient id="lit" cx="0.32" cy="0.24" r="0.4">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="#F4F4F8" />
  <circle cx="16" cy="16" r="11" fill="url(#film)" />
  <circle cx="16" cy="16" r="11" fill="url(#limb)" />
  <circle cx="16" cy="16" r="11" fill="url(#lit)" />
</svg>
